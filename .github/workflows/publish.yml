name: Verify and publish open platform
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ccr.ccs.tencentyun.com
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test
          bun run build
      - name: Verify backend with MySQL and Redis
        run: |
          docker compose -f compose.test.yml run --rm test
          git diff --exit-code
      - name: Stop test services
        if: always()
        run: docker compose -f compose.test.yml down --volumes
  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/lazycampus/lazycampus-platform:1.0.${{ github.run_number }}
            ${{ env.REGISTRY }}/lazycampus/lazycampus-platform:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
