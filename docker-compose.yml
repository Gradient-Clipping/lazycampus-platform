name: lazycampus-platform
services:
  platform:
    build:
      context: .
      args:
        REVISION: ${APP_REVISION:-development}
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    read_only: true
    tmpfs: /tmp:size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 30s
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  redis-data:
